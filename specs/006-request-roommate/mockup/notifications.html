
<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แจ้งเตือนคำขอเป็นเมท — ตัวอย่างหน้าจอ</title>

  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #202a35;
      background: #f3f6f7;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
    }

    /* Navbar: ใช้รูปแบบเดียวกับ request-list.html */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100vw;
      margin: 0 0 24px calc(50% - 50vw);
      padding: 18px max(24px, calc((100% - 920px) / 2));
      background: #fff;
      border-bottom: 1px solid #e4e9ec;
    }

    .main-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .menu-item {
      padding: 8px 12px;
      border-radius: 999px;
      color: #4a5864;
      font-size: .9rem;
      text-decoration: none;
    }

    .menu-item.active {
      color: #125d55;
      background: #e5f4f0;
      font-weight: 700;
    }

    /* Main content */
    main {
      width: min(100% - 32px, 820px);
      margin: 48px auto;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #176b62;
      font-size: .85rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.3rem);
    }

    .intro {
      margin: 10px 0 24px;
      color: #65727c;
      line-height: 1.65;
    }

    .sample-label {
      display: inline-flex;
      margin-bottom: 18px;
      padding: 6px 10px;
      border-radius: 999px;
      color: #596672;
      background: #f0f3f4;
      font-size: .78rem;
      font-weight: 700;
    }

    /* Notification card */
    .notice-card {
      padding: 22px;
      border: 1px solid #e1e8e9;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 24px rgb(34 65 73 / 4%);
    }

    .notice-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
    }

    .notice-copy {
      min-width: 0;
      flex: 1;
    }

    .notice-copy p {
      margin: 0;
      line-height: 1.6;
    }

    .notice-copy strong {
      color: #20333b;
    }

    .notice-copy time {
      display: block;
      margin-top: 6px;
      color: #718089;
      font-size: .84rem;
    }

    .detail-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e8eded;
    }

    .detail-section h2 {
      margin: 0 0 10px;
      color: #34434d;
      font-size: 1rem;
    }

    .detail-message {
      margin: 0;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f3f7f6;
      color: #46545d;
      line-height: 1.7;
    }

    .note {
      margin: 18px 2px 0;
      color: #74808a;
      font-size: .84rem;
      line-height: 1.55;
    }

    @media (max-width: 600px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px;
      }

      .main-menu {
        width: 100%;
        gap: 2px;
      }

      .menu-item {
        padding: 8px 9px;
        font-size: .82rem;
      }

      main {
        width: min(100% - 24px, 820px);
        margin: 28px auto;
      }

      .notice-card {
        padding: 16px;
      }

      .avatar {
        width: 52px;
        height: 52px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <nav class="main-menu" aria-label="เมนูหลัก">
      <a class="menu-item" href="roommate-request.html">ส่งคำขอเป็นเมท</a>
      <a class="menu-item active" href="notifications.html" aria-current="page">แจ้งเตือน</a>
      <a class="menu-item" href="request-list.html">รายการคำขอ</a>
    </nav>
  </header>

  <main>
    <p class="eyebrow">แจ้งเตือน</p>
    <h1>คำขอเป็นเมท</h1>

    <p class="intro">
      รายการแจ้งเตือนคำขอเป็นเมทที่ได้รับ
    </p>

    <article class="notice-card" data-req="FR-RRS-12">
      <div class="notice-header">
        <svg class="avatar"
             viewBox="0 0 80 80"
             role="img"
             aria-label="รูปโปรไฟล์ตัวอย่างของผู้ส่ง">
          <circle cx="40" cy="40" r="40" fill="#e9e1f4"/>
          <circle cx="40" cy="30" r="14" fill="#8061a1"/>
          <path d="M15 72c2-15 12-24 25-24s23 9 25 24"
                fill="#8061a1"/>
        </svg>

        <div class="notice-copy">
          <p>
            <strong>ธนกร วัฒนชัย (ตัวอย่าง)</strong>
            ส่งคำขอเป็นเมทถึงคุณ
          </p>

          <time datetime="2026-11-13T14:25">
            วันนี้ 14:25 (ตัวอย่าง)
          </time>
        </div>
      </div>

      <section class="detail-section" aria-label="ข้อความประกอบคำขอ">
        <h2>ข้อความประกอบคำขอ</h2>
        <p class="detail-message">
          สวัสดีครับ สนใจเป็นเมทด้วยกันไหมครับ
        </p>
      </section>
    </article>

  
  </main>
</body>
</html>
